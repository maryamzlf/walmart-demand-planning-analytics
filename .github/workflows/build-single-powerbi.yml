name: build-single-powerbi

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-single-powerbi-main
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install analytics dependencies
        run: pip install -r requirements.txt

      - name: Download public M5 source data
        run: |
          mkdir -p data/raw /tmp/m5
          curl -L --fail --retry 4 --retry-delay 3 \
            -o /tmp/m5/m5.zip \
            'https://zenodo.org/records/12636070/files/m5-forecasting-accuracy.zip?download=1'
          unzip -j -q /tmp/m5/m5.zip 'calendar.csv' 'sales_train_evaluation.csv' 'sales_train_validation.csv' 'sell_prices.csv' -d data/raw
          ls -lh data/raw

      - name: Validate raw M5 source integrity
        run: |
          python - <<'PY'
          import numpy as np
          import pandas as pd
          from pathlib import Path

          raw = Path('data/raw')
          prices = pd.read_csv(raw / 'sell_prices.csv')
          calendar = pd.read_csv(raw / 'calendar.csv')

          assert not calendar['d'].duplicated().any()
          assert prices['sell_price'].notna().all()
          assert (prices['sell_price'] > 0).all()
          assert not prices.duplicated(['store_id','item_id','wm_yr_wk']).any()

          keys = ['item_id','dept_id','cat_id','store_id','state_id']
          days = [f'd_{i}' for i in range(1, 1914)]
          usecols = keys + days
          eval_iter = pd.read_csv(raw / 'sales_train_evaluation.csv', usecols=usecols, chunksize=1000)
          val_iter = pd.read_csv(raw / 'sales_train_validation.csv', usecols=usecols, chunksize=1000)
          rows = 0
          for e, v in zip(eval_iter, val_iter):
              assert len(e) == len(v)
              assert e[keys].equals(v[keys])
              assert np.array_equal(
                  e[days].to_numpy(dtype=np.int32),
                  v[days].to_numpy(dtype=np.int32),
              )
              rows += len(e)
          assert rows == 30490, rows
          print('Validated M5 source integrity:', rows, 'series; validation history matches evaluation prefix.')
          PY

      - name: Rebuild validated analytics outputs
        env:
          PYTHONPATH: src
        run: |
          python src/run_pipeline.py
          python src/priority_model.py
          python src/final_forecast.py

      - name: Prepare and sanitize Power BI source tables
        run: |
          python - <<'PY'
          import numpy as np
          import pandas as pd
          from pathlib import Path

          p = Path('data/processed/planner_action_center.csv')
          w = Path('data/processed/forecast_weekly_item_store.csv')
          planner = pd.read_csv(p)
          weekly = pd.read_csv(w)

          planner['item_store_key'] = planner['item_id'].astype(str) + '|' + planner['store_id'].astype(str)
          weekly['item_store_key'] = weekly['item_id'].astype(str) + '|' + weekly['store_id'].astype(str)
          weekly['week_start_date'] = pd.to_datetime(weekly['week_start_date'])
          weekly['week_end_date'] = weekly['week_start_date'] + pd.Timedelta(days=6)

          numeric_cols = planner.select_dtypes(include=[np.number]).columns
          inf_before = int(np.isinf(planner[numeric_cols].to_numpy(dtype=float, na_value=np.nan)).sum())
          planner[numeric_cols] = planner[numeric_cols].replace([np.inf, -np.inf], np.nan)
          inf_after = int(np.isinf(planner[numeric_cols].to_numpy(dtype=float, na_value=np.nan)).sum())
          print('Non-finite infinities sanitized:', inf_before, '->', inf_after)
          assert inf_before == 9, inf_before
          assert inf_after == 0

          planner.to_csv(p, index=False)
          weekly.to_csv(w, index=False)

          assert len(planner) == 30490
          assert planner['item_store_key'].is_unique
          assert len(weekly) == 121960
          assert weekly.groupby('item_store_key').size().eq(4).all()
          assert pd.to_numeric(planner['adi'], errors='coerce').replace([np.inf, -np.inf], np.nan).notna().sum() == 30481

          # Regression checks against independently verified M5 aggregates.
          assert abs(float(planner['revenue_365d'].sum()) - 45163441.24) < 1e-6, planner['revenue_365d'].sum()
          assert int(planner['units_365d'].sum()) == 14585821, planner['units_365d'].sum()
          assert int(planner['prior_28d_units'].sum()) == 1231764, planner['prior_28d_units'].sum()
          planner_total = float(planner['forecast_28d_units'].sum())
          assert 800000 < planner_total < 1600000, planner_total
          aggregate_growth = (planner_total - float(planner['prior_28d_units'].sum())) / float(planner['prior_28d_units'].sum())
          assert np.isfinite(aggregate_growth), aggregate_growth
          high_risk_mask = planner['demand_risk_score'] >= 70
          high_risk = int(high_risk_mask.sum())
          high_risk_revenue_share = float(planner.loc[high_risk_mask, 'revenue_365d'].sum() / planner['revenue_365d'].sum())
          growth_review = int((planner['planning_change_signal_pct'] >= 20).sum())
          decline_review = int((planner['planning_change_signal_pct'] <= -20).sum())
          assert 0 < high_risk < len(planner), high_risk
          assert 0.0 < high_risk_revenue_share < 1.0, high_risk_revenue_share
          assert 0 <= growth_review <= len(planner), growth_review
          assert 0 <= decline_review <= len(planner), decline_review
          avg_risk = float(planner['demand_risk_score'].mean())
          assert 0.0 <= avg_risk <= 100.0, avg_risk
          safety_total = float(planner['safety_stock_scenario_units'].sum())
          reorder_total = float(planner['reorder_point_scenario_units'].sum())
          target_total = float(planner['target_stock_scenario_units'].sum())
          print('Scenario totals before regression assertions:', safety_total, reorder_total, target_total)
          assert safety_total >= 0, safety_total
          assert reorder_total >= safety_total, (reorder_total, safety_total)
          assert target_total >= reorder_total, (target_total, reorder_total)
          priority = pd.read_csv('outputs/priority_model_holdout.csv').set_index('model')
          for metric in ['wape','mae','rmse','bias_pct']:
              assert np.isfinite(pd.to_numeric(priority[metric], errors='coerce')).all(), metric
          lg_wape = float(priority.loc['LightGBM','wape'])
          ma28_wape = float(priority.loc['MA28','wape'])
          rel_improvement = (ma28_wape - lg_wape) / ma28_wape
          # LightGBM can show very small platform-level numerical variation.
          # Validate the model relationship and a narrow expected performance band
          # instead of pinning machine-specific floating-point outputs.
          assert 0.44 <= lg_wape <= 0.46, lg_wape
          assert lg_wape < ma28_wape, (lg_wape, ma28_wape)
          assert 0.05 <= rel_improvement <= 0.12, rel_improvement
          assert abs(float(priority.loc['LightGBM','bias_pct'])) < 0.03, priority.loc['LightGBM','bias_pct']
          baseline = pd.read_csv('outputs/baseline_model_summary.csv')
          best = baseline.loc[baseline.groupby('segment')['avg_wape'].idxmin(), ['segment','model']]
          best_routes = dict(zip(best['segment'], best['model']))
          assert best_routes == {'Erratic':'MA28','Intermittent':'MA28','Lumpy':'MA28','Smooth':'WeekdayAvg8'}, best_routes
          assert planner['demand_segment'].value_counts().to_dict() == {
              'Intermittent': 23096, 'Lumpy': 3761, 'Smooth': 2939, 'Erratic': 694
          }, planner['demand_segment'].value_counts().to_dict()
          assert planner['forecast_model_route'].value_counts().to_dict() == {
              'MA28': 26150, 'LightGBM': 3000, 'WeekdayAvg8': 1340
          }, planner['forecast_model_route'].value_counts().to_dict()
          abc_revenue = planner.groupby('abc_class')['revenue_365d'].sum() / planner['revenue_365d'].sum()
          assert set(abc_revenue.index) == {'A','B','C'}, abc_revenue
          assert abs(float(abc_revenue['A']) - 0.80) < 0.002, abc_revenue
          expected_week_starts = {'2016-05-23','2016-05-30','2016-06-06','2016-06-13'}
          weekly_by_date = weekly.groupby(weekly['week_start_date'].astype(str))['forecast_units'].sum().to_dict()
          assert set(weekly_by_date) == expected_week_starts, weekly_by_date
          assert all(float(v) >= 0 for v in weekly_by_date.values()), weekly_by_date
          weekly_total = float(weekly['forecast_units'].sum())
          planner_total = float(planner['forecast_28d_units'].sum())
          weekly_by_key = weekly.groupby('item_store_key', as_index=True)['forecast_units'].sum()
          planner_by_key = planner.set_index('item_store_key')['forecast_28d_units']
          max_recon = float((weekly_by_key.reindex(planner_by_key.index) - planner_by_key).abs().max())
          total_recon = abs(weekly_total - planner_total)
          assert max_recon < 1e-9, max_recon
          assert total_recon < 1e-9, (weekly_total, planner_total, total_recon)
          print('Power BI source rows:', len(planner), len(weekly))
          print('Verified source KPIs:', planner_total, planner['revenue_365d'].sum(), abc_revenue.to_dict(), 'weekly max reconciliation', max_recon)
          print('Planning review counts:', high_risk, growth_review, decline_review, 'avg risk', planner['demand_risk_score'].mean(), 'high-risk revenue share', high_risk_revenue_share)
          print('Scenario totals:', planner['safety_stock_scenario_units'].sum(), planner['reorder_point_scenario_units'].sum(), planner['target_stock_scenario_units'].sum())
          print('Priority metrics:', priority[['wape','mae','rmse','bias_pct']].to_dict('index'), 'relative improvement', rel_improvement)
          PY

      - name: Generate pbi-tools PbixProj source
        run: |
          gzip -dc tools/build_powerbi_source.py.gz > /tmp/build_powerbi_source.py
          sed -i "s#ROOT/'build'/'walmart_pbit_source_qa.json'.write_text#(ROOT/'build'/'walmart_pbit_source_qa.json').write_text#" /tmp/build_powerbi_source.py
          sed -i 's/60000/12000/g' /tmp/build_powerbi_source.py
          python /tmp/build_powerbi_source.py
          cat build/walmart_pbit_source_qa.json

      - name: Fix generated Power Query M syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          qdir = Path('build/walmart_pbit_pbixproj/Model/queries')
          files = sorted(qdir.glob('*.m'))
          assert len(files) == 8, len(files)
          for p in files:
              s = p.read_text(encoding='utf-8')
              s = s.replace(
                  'Table.FromRows(Raw, type table [',
                  'Table.FromRows(Raw, let _t = ((type nullable text) meta [Serialized.Text = true]) in type table ['
              )
              s = s.replace(' = type nullable text', ' = _t')
              p.write_text(s, encoding='utf-8')
              assert '= type nullable text' not in s, p
              assert 'let _t = ((type nullable text) meta [Serialized.Text = true]) in type table [' in s, p
          print('Validated Power BI Enter Data M syntax for', len(files), 'queries')
          PY

      - name: Apply report formatting
        run: python tools/format_powerbi_report.py build/walmart_pbit_pbixproj

      - name: Validate generated M source
        run: |
          python - <<'PY'
          from pathlib import Path
          qdir = Path('build/walmart_pbit_pbixproj/Model/queries')
          max_len = 0
          worst = None
          for p in qdir.glob('*.m'):
              text = p.read_text(encoding='utf-8')
              assert 'Table.FromRows(Raw, let _t = ((type nullable text) meta [Serialized.Text = true]) in type table [' in text
              assert '= type nullable text' not in text
              for line_no, line in enumerate(text.splitlines(), 1):
                  n = len(line)
                  if n > max_len:
                      max_len, worst = n, (p.name, line_no)
          print('Longest M source line:', max_len, worst)
          assert max_len < 32766, (max_len, worst)
          PY

      - name: Download pbi-tools Core 1.2.0
        run: |
          curl -L --fail --retry 4 \
            -o /tmp/pbi-tools.zip \
            'https://github.com/pbi-tools/pbi-tools/releases/download/1.2.0/pbi-tools.core.1.2.0_linux-x64.zip'
          mkdir -p /tmp/pbi-tools
          unzip -q /tmp/pbi-tools.zip -d /tmp/pbi-tools
          TOOL="$(find /tmp/pbi-tools -type f \( -name 'pbi-tools.core' -o -name 'pbi-tools.core.exe' \) | head -1)"
          test -n "$TOOL"
          chmod +x "$TOOL"
          echo "$TOOL" > /tmp/pbi-tools-path
          "$TOOL" info

      - name: Compile Power BI template
        run: |
          TOOL="$(cat /tmp/pbi-tools-path)"
          "$TOOL" compile build/walmart_pbit_pbixproj build/Walmart_M5_Demand_Planning.pbit PBIT true
          ls -lh build/Walmart_M5_Demand_Planning.pbit

      - name: Normalize Power BI page order
        run: |
          python - <<'PY'
          import json, zipfile
          from pathlib import Path

          p = Path('build/Walmart_M5_Demand_Planning.pbit')
          tmp = p.with_suffix('.reordered.pbit')
          desired = [
              'Executive Planning Overview',
              'Demand Forecast & Model Performance',
              'Merchandise & Assortment Planning',
              'Planner Action Center',
              'Scenario Planning',
          ]

          with zipfile.ZipFile(p, 'r') as zin, zipfile.ZipFile(tmp, 'w') as zout:
              for info in zin.infolist():
                  payload = zin.read(info.filename)
                  if info.filename.replace('\\','/').lstrip('/') == 'Report/Layout':
                      layout = json.loads(payload.decode('utf-16-le'))
                      by_name = {section.get('displayName'): section for section in layout.get('sections', [])}
                      assert set(by_name) == set(desired), set(by_name)
                      layout['sections'] = [by_name[name] for name in desired]
                      config = json.loads(layout.get('config', '{}'))
                      config['activeSectionIndex'] = 0
                      layout['config'] = json.dumps(config, separators=(',', ':'))
                      payload = json.dumps(layout, separators=(',', ':')).encode('utf-16-le')
                  zout.writestr(info, payload)

          tmp.replace(p)
          print('Power BI page order normalized:', desired)
          PY

      - name: Validate compiled Power BI package and embedded planner data
        run: |
          python - <<'PY'
          import base64, json, re, zipfile, zlib
          import pandas as pd
          from pathlib import Path

          p = Path('build/Walmart_M5_Demand_Planning.pbit')
          assert p.exists() and p.stat().st_size > 100_000
          with zipfile.ZipFile(p) as z:
              names = z.namelist()
              def find_part(suffix):
                  matches = [n for n in names if n.replace('\\','/').lstrip('/').endswith(suffix)]
                  assert matches, (suffix, names[:50])
                  return matches[0]
              def read_json(name):
                  b = z.read(name)
                  for enc in ('utf-16-le','utf-8-sig','utf-8'):
                      try:
                          return json.loads(b.decode(enc))
                      except Exception:
                          pass
                  raise AssertionError('Could not decode '+name)

              model = read_json(find_part('DataModelSchema'))
              report = read_json(find_part('Report/Layout'))
              tables = model['model']['tables']
              rels = model['model'].get('relationships', [])
              sections = report.get('sections', [])
              visuals = sum(len(s.get('visualContainers', [])) for s in sections)
              assert len(tables) == 8, len(tables)
              assert len(rels) == 1, len(rels)
              assert len(sections) == 5, len(sections)
              expected_page_order = [
                  'Executive Planning Overview',
                  'Demand Forecast & Model Performance',
                  'Merchandise & Assortment Planning',
                  'Planner Action Center',
                  'Scenario Planning',
              ]
              assert [s.get('displayName') for s in sections] == expected_page_order, [s.get('displayName') for s in sections]
              assert visuals == 67, visuals
              table_names = {t['name'] for t in tables}
              assert {'PlannerActionCenter','ForecastWeekly','PriorityModelHoldout'} <= table_names

              # Power BI requires column and measure names to be unique within
              # each table. A compiled package can otherwise exist but fail
              # when opened in Desktop.
              for table in tables:
                  column_names = {c['name'] for c in table.get('columns', [])}
                  measure_names = {m['name'] for m in table.get('measures', [])}
                  overlap = column_names & measure_names
                  assert not overlap, (table['name'], sorted(overlap))

              pac = next(t for t in tables if t['name'] == 'PlannerActionCenter')
              pac_cols = {c['name'] for c in pac.get('columns', [])}
              assert {'State','Store','Department','Category','ABC Class','XYZ Class','ABC-XYZ','Demand Pattern','Item','Planner Action','Risk Score','Planning Change %','Baseline Service Level','Item-Store Forecast Growth %'} <= pac_cols
              assert 'Forecast Growth %' not in pac_cols

              max_m_line = 0
              planner_rows = None
              weekly_rows = None
              priority_rows = None
              for t in tables:
                  for part in t.get('partitions', []):
                      src = part.get('source', {})
                      if src.get('type') != 'm':
                          continue
                      expr = src.get('expression', [''])
                      text = '\n'.join(expr) if isinstance(expr, list) else expr
                      assert '= type nullable text' not in text, t['name']
                      assert 'let _t = ((type nullable text) meta [Serialized.Text = true]) in type table [' in text, t['name']
                      lines = expr if isinstance(expr, list) else text.splitlines()
                      max_m_line = max(max_m_line, *(len(x) for x in lines))

                      if t['name'] in {'PlannerActionCenter', 'ForecastWeekly', 'PriorityModelHoldout'}:
                          prefix = text.split('}),\n    Raw =')[0]
                          chunks = re.findall(r'"([A-Za-z0-9+/=]{20,})"', prefix)
                          raw = zlib.decompress(base64.b64decode(''.join(chunks)), -15)
                          decoded = json.loads(raw)
                          if t['name'] == 'PlannerActionCenter':
                              planner_rows = decoded
                              assert len(planner_rows) == 30490
                              adi = [r[11] for r in planner_rows]
                              assert sum(v is None for v in adi) == 9
                              assert not any(isinstance(v, str) and v.lower() in {'inf','infinity','-inf','-infinity'} for v in adi)
                          elif t['name'] == 'ForecastWeekly':
                              weekly_rows = decoded
                              assert len(weekly_rows) == 121960
                          elif t['name'] == 'PriorityModelHoldout':
                              priority_rows = decoded
                              assert len(priority_rows) == 4

              assert max_m_line < 32766, max_m_line
              assert planner_rows is not None and weekly_rows is not None and priority_rows is not None

              # Raw embedded row order follows the generated source tables.
              planner_revenue = sum(float(r[8]) for r in planner_rows)
              planner_units = sum(int(float(r[7])) for r in planner_rows)
              planner_prior = sum(int(float(r[19])) for r in planner_rows)
              planner_forecast = sum(float(r[20]) for r in planner_rows)
              routes = {}
              segments = {}
              for r in planner_rows:
                  routes[r[35]] = routes.get(r[35], 0) + 1
                  segments[r[13]] = segments.get(r[13], 0) + 1
              assert abs(planner_revenue - 45163441.24) < 1e-6, planner_revenue
              assert planner_units == 14585821, planner_units
              assert planner_prior == 1231764, planner_prior
              assert routes == {'MA28': 26150, 'LightGBM': 3000, 'WeekdayAvg8': 1340}, routes
              assert segments == {'Intermittent': 23096, 'Lumpy': 3761, 'Smooth': 2939, 'Erratic': 694}, segments
              weekly_by_key = {}
              for r in weekly_rows:
                  weekly_by_key[r[1]] = weekly_by_key.get(r[1], 0.0) + float(r[10])
              planner_by_key = {r[1]: float(r[20]) for r in planner_rows}
              max_weekly_recon = max(abs(weekly_by_key[k] - planner_by_key[k]) for k in planner_by_key)
              assert max_weekly_recon < 1e-9, max_weekly_recon

              source_priority = pd.read_csv('outputs/priority_model_holdout.csv').set_index('model')
              embedded_priority = {
                  r[0]: {'wape': float(r[1]), 'mae': float(r[2]), 'rmse': float(r[3]), 'bias_pct': float(r[4])}
                  for r in priority_rows
              }
              for model_name, vals in embedded_priority.items():
                  for metric, value in vals.items():
                      assert abs(value - float(source_priority.loc[model_name, metric])) < 1e-10, (model_name, metric, value, source_priority.loc[model_name, metric])

              pac_measures = {m['name']: m.get('expression') for m in pac.get('measures', [])}
              scenario_target = pac_measures.get('Scenario Target Stock Units')
              scenario_safety = pac_measures.get('Scenario Safety Stock Units')
              assert scenario_target and 'Baseline Target Stock Units' in str(scenario_target), scenario_target
              assert scenario_safety and 'Baseline Safety Stock Units' in str(scenario_safety), scenario_safety
              scenario_delta = pac_measures.get('Scenario Target Stock Delta')
              scenario_delta_pct = pac_measures.get('Scenario Target Stock Delta %')
              assert scenario_delta and 'Scenario Target Stock Units' in str(scenario_delta) and 'Baseline Target Stock Units' in str(scenario_delta)
              assert scenario_delta_pct and 'Scenario Target Stock Delta' in str(scenario_delta_pct)
              priority_table = next(t for t in tables if t['name'] == 'PriorityModelHoldout')
              priority_measures = {m['name']: m.get('expression') for m in priority_table.get('measures', [])}
              bias_measure = priority_measures.get('Priority LightGBM Bias %')
              assert bias_measure and 'bias_pct' in str(bias_measure) and 'LightGBM' in str(bias_measure)
              report_text = json.dumps(report)
              for forbidden in ['item_id','store_id','dept_id','cat_id','abc_class','xyz_class','demand_segment','planner_action','forecast_model_route']:
                  assert forbidden not in report_text, forbidden
              expected_titles = [
                  'Growth vs Prior','High-Risk Item-Store','Planner Action Queue',
                  'Forecast Driver Importance','Forecast Units by Category',
                  'Target Stock Change (Units)','Target Stock Change %'
              ]
              for title in expected_titles:
                  assert title in report_text, title
              assert 'Top 8 Forecast Drivers' not in report_text

              def visual_with_title(page_name, wanted_title):
                  page = next(s for s in sections if s.get('displayName') == page_name)
                  for vc in page.get('visualContainers', []):
                      cfg = json.loads(vc.get('config', '{}'))
                      sv = cfg.get('singleVisual', {})
                      title_objects = sv.get('vcObjects', {}).get('title', [])
                      for obj in title_objects:
                          value = obj.get('properties', {}).get('text', {}).get('expr', {}).get('Literal', {}).get('Value')
                          if isinstance(value, str) and value.strip("'") == wanted_title:
                              return sv
                  raise AssertionError((page_name, wanted_title))

              merch = visual_with_title('Merchandise & Assortment Planning', 'Merchandise Priority Detail')
              merch_refs = [
                  x.get('queryRef')
                  for values in merch.get('projections', {}).values()
                  for x in values
              ]
              assert merch_refs == [
                  'PlannerActionCenter.Item',
                  'PlannerActionCenter.Store',
                  'PlannerActionCenter.Department',
                  'PlannerActionCenter.ABC Class',
                  'PlannerActionCenter.XYZ Class',
                  'PlannerActionCenter.Revenue ($, 365D)',
                  'PlannerActionCenter.Forecast (28D)',
                  'PlannerActionCenter.Planning Change %',
                  'PlannerActionCenter.Risk Score',
              ], merch_refs
              merch_order = merch.get('prototypeQuery', {}).get('OrderBy', [])
              merch_order_props = [
                  x.get('Expression', {}).get('Column', {}).get('Property')
                  for x in merch_order
              ]
              assert merch_order_props[:2] == ['Risk Score', 'Revenue ($, 365D)'], merch_order_props

              action_queue = visual_with_title('Planner Action Center', 'Planner Action Queue')
              action_refs = [
                  x.get('queryRef')
                  for values in action_queue.get('projections', {}).values()
                  for x in values
              ]
              assert action_refs == [
                  'PlannerActionCenter.Item',
                  'PlannerActionCenter.Store',
                  'PlannerActionCenter.ABC-XYZ',
                  'PlannerActionCenter.Demand Pattern',
                  'PlannerActionCenter.Forecast (28D)',
                  'PlannerActionCenter.Planning Change %',
                  'PlannerActionCenter.Risk Score',
                  'PlannerActionCenter.Planner Action',
              ], action_refs

              weekly_visual = visual_with_title('Demand Forecast & Model Performance', 'Weekly Routed Forecast')
              weekly_order = weekly_visual.get('prototypeQuery', {}).get('OrderBy', [])
              assert len(weekly_order) >= 1, weekly_order
              weekly_order_expr = weekly_order[0].get('Expression', {}).get('Column', {})
              assert weekly_order_expr.get('Property') == 'Week Start', weekly_order
              assert weekly_order[0].get('Direction') == 1, weekly_order

              feature_visual = visual_with_title('Demand Forecast & Model Performance', 'Forecast Driver Importance')
              feature_refs = [
                  x.get('queryRef')
                  for values in feature_visual.get('projections', {}).values()
                  for x in values
              ]
              assert feature_refs == [
                  'FeatureImportance.Feature',
                  'FeatureImportance.Feature Importance Share'
              ], feature_refs

              print('VALIDATED POWER BI TEMPLATE:', p.stat().st_size, 'bytes;', len(tables), 'tables;', len(sections), 'pages;', visuals, 'visuals; max M line', max_m_line, '; revenue', planner_revenue, '; forecast', planner_forecast)
          PY

      - name: Commit regenerated analytical evidence
        run: |
          publish_dir="$(mktemp -d)"
          mkdir -p "$publish_dir/outputs"
          cp outputs/data_audit.json \
            outputs/baseline_model_summary.csv \
            outputs/priority_model_holdout.csv \
            outputs/priority_model_holdout.json \
            outputs/priority_feature_importance.csv \
            outputs/segment_summary.csv \
            outputs/planner_action_sample.csv \
            outputs/executive_findings.md \
            "$publish_dir/outputs/"

          # A rerun may start from an older workflow SHA after a prior run has
          # already published the same evidence. Reset the ephemeral checkout
          # to the current remote tip, then re-apply only the generated files.
          git fetch origin "${GITHUB_REF_NAME}"
          git reset --hard "origin/${GITHUB_REF_NAME}"
          mkdir -p outputs
          cp "$publish_dir/outputs/"* outputs/

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add outputs/data_audit.json \
            outputs/baseline_model_summary.csv \
            outputs/priority_model_holdout.csv \
            outputs/priority_model_holdout.json \
            outputs/priority_feature_importance.csv \
            outputs/segment_summary.csv \
            outputs/planner_action_sample.csv \
            outputs/executive_findings.md
          if git diff --cached --quiet; then
            echo "Analytical evidence already up to date."
          else
            git commit -m "Sync validated analytical evidence [skip ci]"
            git push origin HEAD:"${GITHUB_REF_NAME}"
          fi

      - name: Upload single Power BI file
        uses: actions/upload-artifact@v4
        with:
          name: Walmart_M5_Demand_Planning_PBIT
          path: build/Walmart_M5_Demand_Planning.pbit
          retention-days: 90
          if-no-files-found: error


      - name: Upload analytical evidence
        uses: actions/upload-artifact@v4
        with:
          name: Walmart_M5_Demand_Planning_Evidence
          path: |
            outputs/data_audit.json
            outputs/baseline_model_summary.csv
            outputs/priority_model_holdout.csv
            outputs/priority_model_holdout.json
            outputs/priority_feature_importance.csv
            outputs/segment_summary.csv
            outputs/planner_action_sample.csv
            outputs/executive_findings.md
          retention-days: 90
          if-no-files-found: error
