name: build-single-powerbi

on:
  push:
    branches: [main, audit-final-2026-09-27]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-single-powerbi-main
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install analytics dependencies
        run: pip install -r requirements.txt

      - name: Download public M5 source data
        run: |
          mkdir -p data/raw /tmp/m5
          curl -L --fail --retry 4 --retry-delay 3 \
            -o /tmp/m5/m5.zip \
            'https://zenodo.org/records/12636070/files/m5-forecasting-accuracy.zip?download=1'
          unzip -j -q /tmp/m5/m5.zip 'calendar.csv' 'sales_train_evaluation.csv' 'sell_prices.csv' -d data/raw
          ls -lh data/raw

      - name: Rebuild validated analytics outputs
        env:
          PYTHONPATH: src
        run: |
          python src/run_pipeline.py
          python src/priority_model.py
          python src/final_forecast.py

      - name: Prepare and sanitize Power BI source tables
        run: |
          python - <<'PY'
          import numpy as np
          import pandas as pd
          from pathlib import Path

          p = Path('data/processed/planner_action_center.csv')
          w = Path('data/processed/forecast_weekly_item_store.csv')
          planner = pd.read_csv(p)
          weekly = pd.read_csv(w)

          planner['item_store_key'] = planner['item_id'].astype(str) + '|' + planner['store_id'].astype(str)
          weekly['item_store_key'] = weekly['item_id'].astype(str) + '|' + weekly['store_id'].astype(str)
          weekly['week_start_date'] = pd.to_datetime(weekly['week_start_date'])
          weekly['week_end_date'] = weekly['week_start_date'] + pd.Timedelta(days=6)

          numeric_cols = planner.select_dtypes(include=[np.number]).columns
          inf_before = int(np.isinf(planner[numeric_cols].to_numpy(dtype=float, na_value=np.nan)).sum())
          planner[numeric_cols] = planner[numeric_cols].replace([np.inf, -np.inf], np.nan)
          inf_after = int(np.isinf(planner[numeric_cols].to_numpy(dtype=float, na_value=np.nan)).sum())
          print('Non-finite infinities sanitized:', inf_before, '->', inf_after)
          assert inf_before == 9, inf_before
          assert inf_after == 0

          planner.to_csv(p, index=False)
          weekly.to_csv(w, index=False)

          assert len(planner) == 30490
          assert planner['item_store_key'].is_unique
          assert len(weekly) == 121960
          assert weekly.groupby('item_store_key').size().eq(4).all()
          assert pd.to_numeric(planner['adi'], errors='coerce').replace([np.inf, -np.inf], np.nan).notna().sum() == 30481

          # Regression checks against independently verified M5 aggregates.
          assert abs(float(planner['revenue_365d'].sum()) - 45163441.21) < 1.0, planner['revenue_365d'].sum()
          assert int(planner['units_365d'].sum()) == 14585821, planner['units_365d'].sum()
          assert int(planner['prior_28d_units'].sum()) == 1231764, planner['prior_28d_units'].sum()
          assert planner['demand_segment'].value_counts().to_dict() == {
              'Intermittent': 23096, 'Lumpy': 3761, 'Smooth': 2939, 'Erratic': 694
          }, planner['demand_segment'].value_counts().to_dict()
          assert planner['forecast_model_route'].value_counts().to_dict() == {
              'MA28': 26150, 'LightGBM': 3000, 'WeekdayAvg8': 1340
          }, planner['forecast_model_route'].value_counts().to_dict()
          abc_revenue = planner.groupby('abc_class')['revenue_365d'].sum() / planner['revenue_365d'].sum()
          assert set(abc_revenue.index) == {'A','B','C'}, abc_revenue
          assert abs(float(abc_revenue['A']) - 0.80) < 0.002, abc_revenue
          weekly_total = float(weekly['forecast_units'].sum())
          planner_total = float(planner['forecast_28d_units'].sum())
          weekly_by_key = weekly.groupby('item_store_key', as_index=True)['forecast_units'].sum()
          planner_by_key = planner.set_index('item_store_key')['forecast_28d_units']
          max_recon = float((weekly_by_key.reindex(planner_by_key.index) - planner_by_key).abs().max())
          assert max_recon <= 1e-9, max_recon
          print('Power BI source rows:', len(planner), len(weekly))
          print('Verified source KPIs:', planner_total, planner['revenue_365d'].sum(), abc_revenue.to_dict(), 'weekly max reconciliation', max_recon)
          PY

      - name: Generate pbi-tools PbixProj source
        run: |
          gzip -dc tools/build_real_pbit_source.py.gz > /tmp/build_real_pbit_source.py
          sed -i "s#ROOT/'build'/'walmart_pbit_source_qa.json'.write_text#(ROOT/'build'/'walmart_pbit_source_qa.json').write_text#" /tmp/build_real_pbit_source.py
          sed -i 's/60000/12000/g' /tmp/build_real_pbit_source.py
          python /tmp/build_real_pbit_source.py
          cat build/walmart_pbit_source_qa.json

      - name: Fix generated Power Query M syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          qdir = Path('build/walmart_pbit_pbixproj/Model/queries')
          files = sorted(qdir.glob('*.m'))
          assert len(files) == 8, len(files)
          for p in files:
              s = p.read_text(encoding='utf-8')
              s = s.replace(
                  'Table.FromRows(Raw, type table [',
                  'Table.FromRows(Raw, let _t = ((type nullable text) meta [Serialized.Text = true]) in type table ['
              )
              s = s.replace(' = type nullable text', ' = _t')
              p.write_text(s, encoding='utf-8')
              assert '= type nullable text' not in s, p
              assert 'let _t = ((type nullable text) meta [Serialized.Text = true]) in type table [' in s, p
          print('Validated Power BI Enter Data M syntax for', len(files), 'queries')
          PY

      - name: Apply portfolio polish
        run: python tools/polish_powerbi_project.py build/walmart_pbit_pbixproj

      - name: Validate generated M source
        run: |
          python - <<'PY'
          from pathlib import Path
          qdir = Path('build/walmart_pbit_pbixproj/Model/queries')
          max_len = 0
          worst = None
          for p in qdir.glob('*.m'):
              text = p.read_text(encoding='utf-8')
              assert 'Table.FromRows(Raw, let _t = ((type nullable text) meta [Serialized.Text = true]) in type table [' in text
              assert '= type nullable text' not in text
              for line_no, line in enumerate(text.splitlines(), 1):
                  n = len(line)
                  if n > max_len:
                      max_len, worst = n, (p.name, line_no)
          print('Longest M source line:', max_len, worst)
          assert max_len < 32766, (max_len, worst)
          PY

      - name: Download pbi-tools Core 1.2.0
        run: |
          curl -L --fail --retry 4 \
            -o /tmp/pbi-tools.zip \
            'https://github.com/pbi-tools/pbi-tools/releases/download/1.2.0/pbi-tools.core.1.2.0_linux-x64.zip'
          mkdir -p /tmp/pbi-tools
          unzip -q /tmp/pbi-tools.zip -d /tmp/pbi-tools
          TOOL="$(find /tmp/pbi-tools -type f \( -name 'pbi-tools.core' -o -name 'pbi-tools.core.exe' \) | head -1)"
          test -n "$TOOL"
          chmod +x "$TOOL"
          echo "$TOOL" > /tmp/pbi-tools-path
          "$TOOL" info

      - name: Compile real PBIT and PBIX
        run: |
          TOOL="$(cat /tmp/pbi-tools-path)"
          "$TOOL" compile build/walmart_pbit_pbixproj build/Walmart_M5_Demand_Planning.pbit PBIT true
          "$TOOL" compile build/walmart_pbit_pbixproj build/Walmart_M5_Demand_Planning.pbix PBIX true
          ls -lh build/Walmart_M5_Demand_Planning.pbit build/Walmart_M5_Demand_Planning.pbix

      - name: Validate compiled Power BI package and embedded planner data
        run: |
          python - <<'PY'
          import base64, json, re, zipfile, zlib
          import pandas as pd
          from pathlib import Path

          p = Path('build/Walmart_M5_Demand_Planning.pbit')
          assert p.exists() and p.stat().st_size > 100_000
          with zipfile.ZipFile(p) as z:
              names = z.namelist()
              def find_part(suffix):
                  matches = [n for n in names if n.replace('\\','/').lstrip('/').endswith(suffix)]
                  assert matches, (suffix, names[:50])
                  return matches[0]
              def read_json(name):
                  b = z.read(name)
                  for enc in ('utf-16-le','utf-8-sig','utf-8'):
                      try:
                          return json.loads(b.decode(enc))
                      except Exception:
                          pass
                  raise AssertionError('Could not decode '+name)

              model = read_json(find_part('DataModelSchema'))
              report = read_json(find_part('Report/Layout'))
              tables = model['model']['tables']
              rels = model['model'].get('relationships', [])
              sections = report.get('sections', [])
              visuals = sum(len(s.get('visualContainers', [])) for s in sections)
              assert len(tables) == 8, len(tables)
              assert len(rels) == 1, len(rels)
              assert len(sections) == 5, len(sections)
              assert visuals == 67, visuals
              table_names = {t['name'] for t in tables}
              assert {'PlannerActionCenter','ForecastWeekly','PriorityModelHoldout'} <= table_names

              pac = next(t for t in tables if t['name'] == 'PlannerActionCenter')
              pac_cols = {c['name'] for c in pac.get('columns', [])}
              assert {'State','Store','Department','Category','ABC Class','XYZ Class','ABC-XYZ','Demand Pattern','Item','Planner Action','Risk Score','Planning Change %'} <= pac_cols

              max_m_line = 0
              planner_rows = None
              weekly_rows = None
              priority_rows = None
              for t in tables:
                  for part in t.get('partitions', []):
                      src = part.get('source', {})
                      if src.get('type') != 'm':
                          continue
                      expr = src.get('expression', [''])
                      text = '\n'.join(expr) if isinstance(expr, list) else expr
                      assert '= type nullable text' not in text, t['name']
                      assert 'let _t = ((type nullable text) meta [Serialized.Text = true]) in type table [' in text, t['name']
                      lines = expr if isinstance(expr, list) else text.splitlines()
                      max_m_line = max(max_m_line, *(len(x) for x in lines))

                      if t['name'] in {'PlannerActionCenter', 'ForecastWeekly', 'PriorityModelHoldout'}:
                          prefix = text.split('}),\n    Raw =')[0]
                          chunks = re.findall(r'"([A-Za-z0-9+/=]{20,})"', prefix)
                          raw = zlib.decompress(base64.b64decode(''.join(chunks)), -15)
                          decoded = json.loads(raw)
                          if t['name'] == 'PlannerActionCenter':
                              planner_rows = decoded
                              assert len(planner_rows) == 30490
                              adi = [r[11] for r in planner_rows]
                              assert sum(v is None for v in adi) == 9
                              assert not any(isinstance(v, str) and v.lower() in {'inf','infinity','-inf','-infinity'} for v in adi)
                          elif t['name'] == 'ForecastWeekly':
                              weekly_rows = decoded
                              assert len(weekly_rows) == 121960
                          elif t['name'] == 'PriorityModelHoldout':
                              priority_rows = decoded
                              assert len(priority_rows) == 4

              assert max_m_line < 32766, max_m_line
              assert planner_rows is not None and weekly_rows is not None and priority_rows is not None

              # Raw embedded row order follows the generated source tables.
              planner_revenue = sum(float(r[8]) for r in planner_rows)
              planner_units = sum(int(float(r[7])) for r in planner_rows)
              planner_prior = sum(int(float(r[19])) for r in planner_rows)
              planner_forecast = sum(float(r[20]) for r in planner_rows)
              routes = {}
              segments = {}
              for r in planner_rows:
                  routes[r[35]] = routes.get(r[35], 0) + 1
                  segments[r[13]] = segments.get(r[13], 0) + 1
              assert abs(planner_revenue - 45163441.21) < 1.0, planner_revenue
              assert planner_units == 14585821, planner_units
              assert planner_prior == 1231764, planner_prior
              assert routes == {'MA28': 26150, 'LightGBM': 3000, 'WeekdayAvg8': 1340}, routes
              assert segments == {'Intermittent': 23096, 'Lumpy': 3761, 'Smooth': 2939, 'Erratic': 694}, segments
              weekly_by_key = {}
              for r in weekly_rows:
                  weekly_by_key[r[1]] = weekly_by_key.get(r[1], 0.0) + float(r[10])
              planner_by_key = {r[1]: float(r[20]) for r in planner_rows}
              max_weekly_recon = max(abs(weekly_by_key[k] - planner_by_key[k]) for k in planner_by_key)
              assert max_weekly_recon <= 1e-9, max_weekly_recon

              source_priority = pd.read_csv('outputs/priority_model_holdout.csv').set_index('model')
              embedded_priority = {
                  r[0]: {'wape': float(r[1]), 'mae': float(r[2]), 'rmse': float(r[3]), 'bias_pct': float(r[4])}
                  for r in priority_rows
              }
              for model_name, vals in embedded_priority.items():
                  for metric, value in vals.items():
                      assert abs(value - float(source_priority.loc[model_name, metric])) < 1e-10, (model_name, metric, value, source_priority.loc[model_name, metric])

              pac_measures = {m['name']: m.get('expression') for m in pac.get('measures', [])}
              scenario_target = pac_measures.get('Scenario Target Stock Units')
              scenario_safety = pac_measures.get('Scenario Safety Stock Units')
              assert scenario_target and 'Baseline Target Stock Units' in str(scenario_target), scenario_target
              assert scenario_safety and 'Baseline Safety Stock Units' in str(scenario_safety), scenario_safety

              print('VALIDATED POLISHED PBIT:', p.stat().st_size, 'bytes;', len(tables), 'tables;', len(sections), 'pages;', visuals, 'visuals; max M line', max_m_line, '; revenue', planner_revenue, '; forecast', planner_forecast)

          pbix = Path('build/Walmart_M5_Demand_Planning.pbix')
          assert pbix.exists() and pbix.stat().st_size > 100_000
          with zipfile.ZipFile(pbix) as z:
              names = [n.replace('\\','/').lstrip('/') for n in z.namelist()]
              assert any(n.endswith('DataModel') or n.endswith('DataModelSchema') for n in names), names[:50]
              assert any(n.endswith('Report/Layout') or n.endswith('Report/definition/report.json') for n in names), names[:50]
          print('VALIDATED PBIX PACKAGE:', pbix.stat().st_size, 'bytes')
          PY

      - name: Commit generated Power BI portfolio template
        run: |
          mkdir -p powerbi
          cp build/Walmart_M5_Demand_Planning.pbit powerbi/Walmart_M5_Demand_Planning_Portfolio.pbit
          cp build/Walmart_M5_Demand_Planning.pbix powerbi/Walmart_M5_Demand_Planning_Portfolio.pbix
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add powerbi/Walmart_M5_Demand_Planning_Portfolio.pbit powerbi/Walmart_M5_Demand_Planning_Portfolio.pbix
          if git diff --cached --quiet; then
            echo "Power BI template already up to date."
          else
            git commit -m "Add generated Power BI portfolio template [skip ci]"
            git push origin HEAD:${GITHUB_REF_NAME}
          fi

      - name: Upload Power BI files
        uses: actions/upload-artifact@v4
        with:
          name: Walmart_M5_Demand_Planning_PowerBI
          path: |
            build/Walmart_M5_Demand_Planning.pbit
            build/Walmart_M5_Demand_Planning.pbix
          retention-days: 90
          if-no-files-found: error


      - name: Upload analytical evidence
        uses: actions/upload-artifact@v4
        with:
          name: Walmart_M5_Demand_Planning_Evidence
          path: |
            outputs/baseline_model_summary.csv
            outputs/priority_model_holdout.csv
            outputs/priority_model_holdout.json
            outputs/priority_feature_importance.csv
            outputs/segment_summary.csv
            outputs/planner_action_sample.csv
          retention-days: 90
          if-no-files-found: error
