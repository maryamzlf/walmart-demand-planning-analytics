name: code-quality

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/src
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install lightweight test dependencies
        run: pip install numpy==2.3.5 pandas==2.2.3 pytest==9.1.1
      - name: Syntax check
        run: python -m py_compile src/*.py tests/*.py tools/*.py
      - name: Unit tests
        run: pytest -q tests