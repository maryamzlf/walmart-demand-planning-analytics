name: code-quality

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/src
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install lightweight test dependencies
        run: pip install numpy pandas pytest
      - name: Syntax check
        run: python -m py_compile src/*.py tests/*.py tools/*.py
      - name: Unit tests
        run: pytest -q tests
      - name: Content hygiene
        run: |
          if grep -RniE 'ChatGPT|OpenAI|AI-generated|As an AI|large language model|generated by AI' README.md docs powerbi src sql tools --exclude='*.gz'; then
            echo "Remove assistant/AI attribution from portfolio-facing content."
            exit 1
          fi
