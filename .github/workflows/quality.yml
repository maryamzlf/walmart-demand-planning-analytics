name: code-quality

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install lightweight test dependencies
        run: pip install numpy pandas pytest
      - name: Syntax check
        run: python -m py_compile src/*.py tests/*.py
      - name: Unit tests
        run: pytest -q tests/test_planning_logic.py
